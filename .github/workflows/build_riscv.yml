name: Build QEMU 7.2 (Ubuntu 24.04, from repo source)

on:
  workflow_dispatch:
    inputs:
      target_list:
        description: "QEMU target list"
        required: false
        default: "riscv64-softmmu,riscv64-linux-user"
      extra_configure_flags:
        description: "Extra flags for ./configure"
        required: false
        default: ""
      build_docs:
        description: "Build docs (requires sphinx)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake autotools-dev curl libmpc-dev libmpfr-dev libgmp-dev \
            gawk build-essential bison flex texinfo gperf libtool patchutils bc \
            zlib1g-dev libexpat1-dev pkg-config libglib2.0-dev libpixman-1-dev \
            git tmux python3 wget xz-utils ninja-build meson \
            libslirp-dev libfdt-dev libcapstone-dev

      - name: Install doc dependencies (optional)
        if: ${{ inputs.build_docs == true }}
        run: |
          set -euxo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-sphinx sphinx-rtd-theme-common

      - name: Configure
        run: |
          set -euxo pipefail

          DOC_FLAG="--disable-docs"
          if [ "${{ inputs.build_docs }}" = "true" ]; then
            DOC_FLAG="--enable-docs"
          fi

          ./configure \
            --target-list="${{ inputs.target_list }}" \
            ${DOC_FLAG} \
            ${{ inputs.extra_configure_flags }}

      - name: Build
        run: |
          set -euxo pipefail
          make -j"$(nproc)"

      - name: Show versions
        run: |
          set -euxo pipefail
          ./build/qemu-system-riscv64 --version || true
          ./build/qemu-riscv64 --version || true
          ./build/qemu-img --version || true

      - name: Pack artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp -a build/qemu-system-* artifacts/ || true
          cp -a build/qemu-riscv64 artifacts/ || true
          cp -a build/qemu-img artifacts/ || true
          cp -a build/qemu-io artifacts/ || true
          cp -a build/qemu-nbd artifacts/ || true
          tar -C artifacts -czf qemu-7.2.0-ubuntu24-artifacts.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-7.2.0-ubuntu24
          path: |
            qemu-7.2.0-ubuntu24-artifacts.tar.gz
            artifacts/
          if-no-files-found: warn